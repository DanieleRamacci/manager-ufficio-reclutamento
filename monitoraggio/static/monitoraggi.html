<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoraggi mensili</title>
  <link rel="stylesheet" href="/monitoraggio/mensile.css">
  <script src="/monitoraggio/menu.js" defer></script>
</head>
<body>
  <main id="contenuto"><p class="muted">Caricamento…</p></main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ora = (iso) => iso ? new Date(iso).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" }) : "";
    const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
    const meseScelto = location.pathname.split("/")[3];
    async function chiama(url, opzioni) {
      const r = await fetch(url, { cache: "no-store", ...opzioni });
      const corpo = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(corpo.error || `Errore ${r.status}`);
      return corpo;
    }
    const jsonPost = (metodo, dati) => ({ method: metodo, headers: { "Content-Type": "application/json" }, body: JSON.stringify(dati) });

    async function elenco() {
      const { monitoraggi } = await chiama("/api/monitoraggi");
      const oggi = new Date();
      $("contenuto").innerHTML = `
        <h1>Monitoraggi mensili</h1>
        <section class="solo-admin">
          <h2>+ Crea monitoraggio</h2>
          <form id="crea" class="riga">
            <label>Mese <select id="mese">${MESI.map((m, i) => `<option value="${i + 1}"${i === oggi.getMonth() ? " selected" : ""}>${m}</option>`).join("")}</select></label>
            <span class="muted" style="padding-bottom:9px">${oggi.getFullYear()}</span>
            <button class="primario" type="submit">+ Crea monitoraggio</button>
          </form>
          <p class="muted small">I due Excel, vuoti e già rinominati, sono subito scaricabili. I dati di riferimento sono quelli del mese precedente: si possono cambiare dopo.</p>
          <div class="errore" id="errore" role="alert" hidden></div>
        </section>
        <section><h2>Monitoraggi creati</h2><div class="scroll"><table>
          <thead><tr><th>Mese</th><th>Dati di</th><th>Stato</th><th>Solleciti segnati</th><th>Creato</th></tr></thead><tbody>
          ${monitoraggi.map(m => `<tr><td><a href="/monitoraggio/mensili/${esc(m.mese)}">${esc(m.etichetta)}</a></td><td>${esc(m.etichetta_dati)}</td><td>${m.stato === "chiuso" ? `Chiuso il ${ora(m.chiuso_il)}` : "Aperto"}</td><td>${m.solleciti_inviati}</td><td>${esc(m.creato_da)} ${ora(m.creato_il)}</td></tr>`).join("")
            || `<tr><td colspan="5" class="muted">Nessun monitoraggio creato.</td></tr>`}
          </tbody></table></div></section>`;
      $("crea").onsubmit = async (e) => {
        e.preventDefault();
        try {
          const r = await chiama("/api/monitoraggi", jsonPost("POST", { numero_mese: Number($("mese").value) }));
          location.href = `/monitoraggio/mensili/${r.mese}`;
        } catch (err) { $("errore").hidden = false; $("errore").textContent = err.message; }
      };
    }

    function disegna(m) {
      if (m.stato === "chiuso") { disegnaChiuso(m); caricaRegistro(m.mese); return; }
      const e = m.email, p = m.posta;
      const opzioniMesi = [];
      const [anno, numero] = m.mese.split("-").map(Number);
      for (let i = 0; i < 13; i++) {
        const d = new Date(anno, numero - 1 - i, 1);
        const valore = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
        opzioniMesi.push(`<option value="${valore}"${valore === m.mese_dati ? " selected" : ""}>${MESI[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</option>`);
      }
      $("contenuto").innerHTML = `
        <p class="small"><a href="/monitoraggio/mensili">← Monitoraggi mensili</a></p>
        <h1>Monitoraggio di ${esc(m.etichetta)}</h1>
        <p class="muted">Dati di ${esc(m.etichetta_dati)} · creato da ${esc(m.creato_da)} il ${ora(m.creato_il)}</p>
        <div class="${p.prova ? "avviso" : "ok"} solo-admin">${p.prova ? `Email di prova attiva: vanno solo a ${esc(p.prova)}.` : "Invio reale attivo: le email vanno ai destinatari veri."} <a href="/monitoraggio/impostazioni">Impostazioni</a></div>
        <section class="solo-admin">
          <h2>Chiusura</h2>
          <p class="muted small">Quando hai finito, chiudi il monitoraggio: viene salvata una versione di atti, difformità, solleciti e conteggi dei punteggi di ${esc(m.etichetta_dati)}, che non cambia più. Se poi correggono i dati, puoi generarne una nuova: le precedenti restano. Lancia prima un aggiornamento dei dati e la verifica dei punteggi.</p>
          <div class="azioni"><button class="primario" type="button" id="chiudi-monitoraggio">Chiudi il monitoraggio</button></div>
        </section>
        <section>
          <h2>Vista e difformità</h2>
          <div class="azioni">
            <a class="pulsante primario" href="${esc(m.link_vista)}">Difformità del mese e solleciti</a>
            <a class="pulsante" href="/monitoraggio?mese=${esc(m.mese_dati)}">Tutti gli atti</a>
          </div>
          <p class="muted small">Nelle difformità trovi anteprima, invio e spunta per ogni bando. Solleciti segnati: ${m.solleciti.length}.</p>
          <label class="solo-admin">Mese dei dati <select id="mese-dati">${opzioniMesi.join("")}</select></label>
        </section>
        <section id="registro-difformita"></section>
        <section class="solo-admin">
          <h2>File Excel</h2>
          <div class="azioni">
            <a class="pulsante primario" href="/api/monitoraggi/${m.mese}/excel/scorrimenti">${esc(m.file_scorrimenti)}</a>
            <a class="pulsante primario" href="/api/monitoraggi/${m.mese}/excel/graduatorie">${esc(m.file_graduatorie)}</a>
          </div>
          <p class="muted small">Sono vuoti e già rinominati: caricali sulla cartella condivisa.</p>
          <details>
            <summary>Graduatorie con i dati raccolti</summary>
            <p class="small"><a href="/api/monitoraggi/${m.mese}/excel/graduatorie-con-dati">Scarica il file compilato con i dati di ${esc(m.etichetta_dati)}</a></p>
            ${m.graduatorie_senza_elenco ? `<div class="avviso">${m.graduatorie_senza_elenco} graduatorie senza elenco dei candidati: lancia prima la verifica dei punteggi.</div>` : ""}
            <p class="muted small">Contiene dati personali dei candidati, se la verifica è stata eseguita.</p>
          </details>
        </section>
        <section class="solo-admin">
          <h2>Email di richiesta di compilazione</h2>
          <div class="riga">
            <label class="campo-largo">Link del file scorrimenti <input id="link-scorrimenti" type="url" value="${esc(m.link_scorrimenti)}" placeholder="https://"></label>
            <label class="campo-largo">Link del file graduatorie <input id="link-graduatorie" type="url" value="${esc(m.link_graduatorie)}" placeholder="https://"></label>
          </div>
          <div class="azioni"><button type="button" id="salva-link">Salva i link</button></div>
          <h3>Destinatari</h3>
          <textarea id="destinatari" style="min-height:70px" placeholder="un indirizzo per riga">${esc(e.destinatari.join("\n"))}</textarea>
          <div class="azioni"><button type="button" id="salva-destinatari">Salva i destinatari</button><span class="muted small">Valgono per tutti i mesi.</span></div>
          <h3>Anteprima</h3>
          <p class="small"><b>Oggetto:</b> ${esc(e.oggetto)}</p>
          <textarea id="anteprima" readonly>${esc(e.corpo)}</textarea>
          ${e.mancanti.length ? `<div class="avviso">Per inviare manca: ${esc(e.mancanti.join(", "))}.</div>` : ""}
          ${p.configurata ? "" : `<div class="avviso">Invio email non configurato: puoi copiare il testo.</div>`}
          <div class="azioni">
            <button class="primario" type="button" id="invia"${p.configurata && !e.mancanti.length ? "" : " disabled"}>Invia ai ${e.destinatari.length} destinatari</button>
            <button type="button" id="copia">Copia il testo</button>
            <span class="muted small" id="esito" aria-live="polite"></span>
          </div>
          <details style="margin-top:14px">
            <summary>Modifica il testo</summary>
            <p class="muted small">Segnaposto: {mese} {mese_dati} {cartella} {file_scorrimenti} {link_scorrimenti} {file_graduatorie} {link_graduatorie}</p>
            <label class="campo-largo">Oggetto <input id="modello-oggetto" value="${esc(e.modello_oggetto)}"></label>
            <textarea id="modello-testo" style="margin-top:10px">${esc(e.modello_testo)}</textarea>
            <div class="azioni">
              <button type="button" id="salva-mese">Salva solo per ${esc(m.etichetta)}</button>
              <button type="button" id="salva-generale">Salva per i mesi successivi</button>
              ${e.personalizzato ? `<button type="button" id="ripristina">Torna al testo generale</button>` : ""}
            </div>
          </details>
          <div class="errore" id="errore" role="alert" hidden></div>
        </section>
        <section class="solo-admin">
          <h2>Registro degli invii</h2>
          <div class="scroll"><table><thead><tr><th>Quando</th><th>Tipo</th><th>Bando</th><th>A</th><th>Esito</th><th>Da</th></tr></thead><tbody>
          ${m.invii.map(i => `<tr><td>${ora(i.quando)}</td><td>${i.tipo === "sollecito" ? "Sollecito" : "Compilazione"}</td><td>${esc(i.numero_bando)}</td><td>${esc(i.destinatari)}</td><td>${esc(i.esito)}${i.errore ? `: ${esc(i.errore)}` : ""}</td><td>${esc(i.utente)}</td></tr>`).join("")
            || `<tr><td colspan="6" class="muted">Nessun invio.</td></tr>`}
          </tbody></table></div>
        </section>`;
      caricaRegistro(m.mese);
      const errore = (t) => { $("errore").hidden = !t; $("errore").textContent = t || ""; };
      const azione = (id, fn) => { const b = $(id); if (b) b.onclick = async () => { try { errore(); await fn(); } catch (err) { errore(err.message); } }; };
      const aggiorna = async (dati) => disegna(await chiama(`/api/monitoraggi/${m.mese}`, jsonPost("PUT", dati)));
      $("mese-dati").onchange = () => aggiorna({ mese_dati: $("mese-dati").value }).catch(err => errore(err.message));
      azione("chiudi-monitoraggio", async () => {
        if (!confirm(`Chiudere il monitoraggio di ${m.etichetta}?\n\nI dati vengono salvati così come sono ora.`)) return;
        disegna(await chiama(`/api/monitoraggi/${m.mese}/chiudi`, { method: "POST" }));
      });
      azione("salva-link", () => aggiorna({ link_scorrimenti: $("link-scorrimenti").value, link_graduatorie: $("link-graduatorie").value }));
      azione("salva-destinatari", async () => { await chiama("/api/impostazioni/email", jsonPost("PUT", { destinatari: $("destinatari").value })); await dettaglio(); });
      azione("salva-mese", () => aggiorna({ oggetto: $("modello-oggetto").value, testo: $("modello-testo").value }));
      azione("salva-generale", async () => {
        await chiama("/api/impostazioni/email", jsonPost("PUT", { oggetto: $("modello-oggetto").value, testo: $("modello-testo").value }));
        await aggiorna({ oggetto: "", testo: "" });
      });
      azione("ripristina", () => aggiorna({ oggetto: "", testo: "" }));
      azione("copia", async () => {
        const testo = `Oggetto: ${e.oggetto}\n\n${e.corpo}`;
        try { await navigator.clipboard.writeText(testo); $("esito").textContent = "Copiato."; }
        catch { $("anteprima").select(); $("esito").textContent = "Copia automatica non disponibile: seleziona e copia."; }
      });
      azione("invia", async () => {
        const avviso = p.prova ? `In prova, solo a ${p.prova}` : `INVIO REALE a: ${e.destinatari.join(", ")}`;
        if (!confirm(`Inviare l'email?\n\n${avviso}`)) return;
        const r = await chiama(`/api/monitoraggi/${m.mese}/email-compilazione/invia`, { method: "POST" });
        await dettaglio();
        $("esito").textContent = r.prova ? "Inviata in prova." : "Inviata.";
      });
    }
    // --- registro delle difformità
    const BADGE = { da_correggere: "Da correggere", parziale: "Parzialmente corretta", corretta: "Corretta", da_controllare: "Da controllare" };
    const EVENTI = { rilevata: "rilevata", cambiata: "rilievi cambiati", corretta: "corretta", ricomparsa: "ricomparsa", non_trovata: "atto non più trovato" };
    const dataIt = (d) => (d || "").slice(0, 10).split("-").reverse().join("/");
    const INDETERMINATO = ["tempo_indeterminato", "reclutamento_speciale", "categorie_protette"];
    let filtriRegistro = { stato: "", tipologia: "" };
    let attesaRegistro = null;
    function esitoVerifica(v) {
      if (!v || v.in_corso || !v.fine) return "";
      const r = v.risultato || {};
      const parti = [`Verifica finita: ${r.corrette || 0} corrette, ${r.ricomparse || 0} ricomparse, ${r.nuove || 0} nuove.`];
      parti.push(v.punteggi_riletti ? "Punteggi riletti." : "Punteggi NON riletti: per controllarli avvia Collega-SOL.");
      return `<div class="${v.errori.length ? "avviso" : "ok"}">${esc(parti.join(" "))}${v.errori.map(e => `<div class="small">${esc(e)}</div>`).join("")}</div>`;
    }
    async function caricaRegistro(mese) {
      const contenitore = $("registro-difformita");
      if (!contenitore) return;
      let d;
      try { d = await chiama(`/api/monitoraggi/${mese}/difformita`); }
      catch (err) { contenitore.innerHTML = `<div class="errore" role="alert">${esc(err.message)}</div>`; return; }
      const v = d.verifica, inCorso = v.in_corso, qui = v.mese === mese;
      const visibili = d.voci.filter(x => (!filtriRegistro.stato || x.badge === filtriRegistro.stato)
        && (!filtriRegistro.tipologia || !x.tipologia || (filtriRegistro.tipologia === "indeterminato") === INDETERMINATO.includes(x.tipologia)));
      contenitore.innerHTML = `
        <h2>Difformità e correzioni</h2>
        <p class="muted small">Restano qui anche dopo la correzione. Ultimo controllo: ${d.ultimo_controllo ? ora(d.ultimo_controllo) : "mai"}. Si aggiornano da sole dopo ogni aggiornamento dei dati, e subito con Verifica.</p>
        ${d.fonti_affidabili ? "" : `<div class="avviso">L'ultima raccolta di una fonte non è riuscita o non è stata fatta: finché non riesce, nessuna difformità viene segnata come corretta.</div>`}
        <div class="conteggi">
          <span class="badge da_correggere">Da correggere: ${d.conteggi.da_correggere}</span>
          <span class="badge parziale">Parziali: ${d.conteggi.parziale}</span>
          <span class="badge corretta">Corrette: ${d.conteggi.corretta}</span>
          ${d.conteggi.da_controllare ? `<span class="badge da_controllare">Da controllare: ${d.conteggi.da_controllare}</span>` : ""}
        </div>
        <div class="azioni">
          <label>Stato <select id="filtro-stato"><option value="">Tutti</option>${Object.entries(BADGE).map(([k, t]) => `<option value="${k}"${filtriRegistro.stato === k ? " selected" : ""}>${t}</option>`).join("")}</select></label>
          <label>Tipologia <select id="filtro-tipologia"><option value="">Tutte</option><option value="indeterminato"${filtriRegistro.tipologia === "indeterminato" ? " selected" : ""}>Tempo indeterminato (concorsi pubblici)</option><option value="mobilita"${filtriRegistro.tipologia === "mobilita" ? " selected" : ""}>Mobilità e comandi</option></select></label>
          <button class="primario solo-admin" type="button" id="verifica-tutte"${inCorso ? " disabled" : ""}>Verifica tutte</button>
        </div>
        ${inCorso ? `<div class="avviso" role="status">Verifica in corso${qui ? `: ${v.fatti} di ${v.totale} bandi` : " su un altro monitoraggio"}…</div>` : qui ? esitoVerifica(v) : ""}
        <div class="errore" id="errore-registro" role="alert" hidden></div>
        <div class="scroll"><table>
          <thead><tr><th>Stato</th><th>Atto</th><th>Rilievi</th><th>Sollecito</th><th></th></tr></thead><tbody>
          ${visibili.map(x => `<tr>
            <td><span class="badge ${x.badge}">${BADGE[x.badge]}</span>${x.corretta_il ? `<div class="muted small">il ${ora(x.corretta_il)}</div>` : ""}</td>
            <td><b>${esc(x.codice || x.numero_bando)}</b><div class="small">${esc(x.atto)} del ${esc(dataIt(x.data))}</div>${x.protocollo ? `<div class="muted small">prot. ${esc(x.protocollo)}</div>` : ""}</td>
            <td><ul class="rilievi">${x.rilievi.map(r => `<li${r.risolto ? ' class="risolto"' : ""}>${esc(r.testo)}${r.nuovo ? " (nuovo)" : ""}</li>`).join("")}</ul>
              <details><summary>Storico</summary>${x.storico.map(e => `<div class="small">${ora(e.quando)}: ${esc(EVENTI[e.tipo] || e.tipo)} (${esc(e.origine)}${e.utente ? `, ${esc(e.utente)}` : ""})</div>`).join("")}</details></td>
            <td class="small">${x.sollecito ? `${x.sollecito.stato === "inviata" ? "Inviata" : "Inviata a mano"}<div class="muted">${ora(x.sollecito.quando)}</div>` : `<span class="muted">Non inviata</span>`}</td>
            <td>${x.badge === "corretta" ? "" : `<button type="button" class="solo-admin" data-verifica="${x.id}"${inCorso ? " disabled" : ""}>Verifica</button>`}</td>
          </tr>`).join("") || `<tr><td colspan="5" class="muted">${d.totale ? "Nessuna difformità con questi filtri." : "Nessuna difformità rilevata."}</td></tr>`}
          </tbody></table></div>`;
      $("filtro-stato").onchange = () => { filtriRegistro.stato = $("filtro-stato").value; caricaRegistro(mese); };
      $("filtro-tipologia").onchange = () => { filtriRegistro.tipologia = $("filtro-tipologia").value; caricaRegistro(mese); };
      const avvia = async (dati) => {
        try { await chiama(`/api/monitoraggi/${mese}/difformita/verifica`, jsonPost("POST", dati)); caricaRegistro(mese); }
        catch (err) { $("errore-registro").hidden = false; $("errore-registro").textContent = err.message; }
      };
      $("verifica-tutte").onclick = () => avvia({});
      contenitore.querySelectorAll("[data-verifica]").forEach(b => b.onclick = () => avvia({ ids: [Number(b.dataset.verifica)] }));
      clearTimeout(attesaRegistro);
      if (inCorso) attesaRegistro = setTimeout(() => caricaRegistro(mese), 2000);
    }

    function statoCella(stato, protocollo) {
      return `${esc((stato || "").replaceAll("_", " "))}${protocollo ? `<div class="muted small">${esc(protocollo)}</div>` : ""}`;
    }
    function disegnaChiuso(m) {
      const f = m.fotografia;
      const tabella = (righe) => `<div class="scroll"><table>
        <thead><tr><th>Data</th><th>Codice</th><th>Atto</th><th>Protocollo</th><th>SOL</th><th>URP</th><th>File segreteria</th><th>RdP</th><th>Note</th><th>Sollecito</th></tr></thead><tbody>
        ${righe.map(r => `<tr><td>${esc((r.data || "").split("-").reverse().join("/"))}</td><td>${esc(r.codice || r.numero_bando)}</td><td>${esc(r.atto)}</td><td>${esc(r.protocollo)}</td>
          <td>${statoCella(r.sol_stato, r.sol_protocollo)}</td><td>${statoCella(r.urp_stato, r.urp_protocollo)}</td><td>${statoCella(r.segreteria_stato, r.segreteria_protocollo)}</td>
          <td>${r.rdp.map(p => esc([p.nome, p.cognome].filter(Boolean).join(" "))).join("<br>")}</td><td>${r.note.map(esc).join("<br>")}</td>
          <td>${r.sollecito_stato ? `${r.sollecito_stato === "inviata" ? "Inviata" : "Inviata a mano"} ${ora(r.sollecito_quando)}` : ""}</td></tr>`).join("")
          || `<tr><td colspan="10" class="muted">Nessuna riga.</td></tr>`}
        </tbody></table></div>`;
      const vecchia = f.versione !== f.ultima;
      const attuale = f.versioni.find(v => v.versione === f.versione) || {};
      $("contenuto").innerHTML = `
        <p class="small"><a href="/monitoraggio/mensili">← Monitoraggi mensili</a></p>
        <h1>Monitoraggio di ${esc(m.etichetta)}</h1>
        <div class="ok">Chiuso da ${esc(m.chiuso_da)} il ${ora(m.chiuso_il)}. Stai vedendo la versione ${f.versione} di ${f.ultima}, creata il ${ora(attuale.creata_il)}${attuale.motivo ? `: ${esc(attuale.motivo)}` : ""}.</div>
        ${vecchia ? `<div class="avviso">Questa non è l'ultima versione. <a href="/monitoraggio/mensili/${m.mese}">Vai all'ultima</a></div>` : ""}
        ${f.dati_piu_recenti.length ? `<div class="avviso solo-admin">Dopo l'ultima versione c'è stata una nuova ${esc(f.dati_piu_recenti.join(" e una nuova "))}: se è il caso, genera una nuova versione.</div>` : ""}
        <p class="muted">Dati di ${esc(m.etichetta_dati)} · ${f.fonti.map(x => `ultima raccolta ${esc(x.fonte.toUpperCase())}: ${x.ultima_raccolta ? ora(x.ultima_raccolta) : "mai"}`).join(" · ")}</p>
        <section class="solo-admin">
          <h2>Aggiornare i dati del mese</h2>
          <p class="muted small">Se hanno corretto Selezioni Online: aggiorna i dati e verifica i punteggi di ${esc(m.etichetta_dati)}, poi genera una nuova versione. Le precedenti restano consultabili.</p>
          <div class="azioni">
            <a class="pulsante" href="${esc(m.link_vista)}">Aggiorna i dati e verifica i punteggi</a>
            <button class="primario" type="button" id="nuova-versione">Genera nuova versione</button>
            <span class="muted small" id="esito-versione" aria-live="polite"></span>
          </div>
        </section>
        <section><h2>Versioni</h2><div class="scroll"><table>
          <thead><tr><th>Versione</th><th>Creata</th><th>Motivo</th><th>Atti</th><th>Difformità</th><th>Solleciti</th><th>Punteggi verificati</th></tr></thead><tbody>
          ${f.versioni.map(v => `<tr><td>${v.versione === f.versione ? `<b>${v.versione}</b>` : `<a href="#" data-versione="${v.versione}">${v.versione}</a>`}</td><td>${ora(v.creata_il)} ${esc(v.creata_da)}</td><td>${esc(v.motivo)}</td><td>${v.totale}</td><td>${v.difformi}</td><td>${v.inviate}</td><td>${v.punteggi_verificati}</td></tr>`).join("")}
          </tbody></table></div></section>
        <section id="registro-difformita"></section>
        <section><h2>Difformità in questa versione: ${f.difformi} su ${f.totale} atti, solleciti segnati su ${f.inviate}</h2>${tabella(f.righe.filter(r => r.difforme))}</section>
        <details><summary>Tutti gli atti del mese (${f.totale})</summary>${tabella(f.righe)}</details>
        <section style="margin-top:14px"><h2>Punteggi di questa versione (${f.punteggi.length})</h2><div class="scroll"><table>
          <thead><tr><th>Codice</th><th>Protocollo</th><th>Domande</th><th>Con punteggi</th><th>V</th><th>I</th><th>S</th><th>Senza protocollo</th><th>Esito</th><th>Verificato il</th></tr></thead><tbody>
          ${f.punteggi.map(p => `<tr><td>${esc(p.codice)}</td><td>${esc(p.protocollo)}</td><td>${esc(p.domande)}</td><td>${esc(p.con_punteggi)}</td><td>${esc(p.vincitori)}</td><td>${esc(p.idonei)}</td><td>${esc(p.scorrimento)}</td><td>${esc(p.senza_protocollo)}</td><td>${esc(p.esito)}</td><td>${ora(p.verificato_il)}</td></tr>`).join("")
            || `<tr><td colspan="10" class="muted">Nessuna verifica salvata.</td></tr>`}
          </tbody></table></div></section>
        <section><h2>Storico</h2>${f.eventi.map(e => `<div class="small">${ora(e.quando)}: ${esc(e.azione)} da ${esc(e.autore)}</div>`).join("")}
          <div class="azioni solo-admin"><button type="button" id="riapri">Riapri il monitoraggio</button></div>
          <div class="errore" id="errore" role="alert" hidden></div></section>`;
      const errore = (err) => { $("errore").hidden = false; $("errore").textContent = err.message; };
      $("riapri").onclick = async () => {
        if (!confirm("Riaprire il monitoraggio? Potrai di nuovo modificarlo e inviare email. Le versioni salvate restano.")) return;
        try { disegna(await chiama(`/api/monitoraggi/${m.mese}/riapri`, { method: "POST" })); } catch (err) { errore(err); }
      };
      $("nuova-versione").onclick = async () => {
        const motivo = prompt("Motivo della nuova versione (facoltativo):", "");
        if (motivo === null) return;
        try { disegna(await chiama(`/api/monitoraggi/${m.mese}/nuova-versione`, jsonPost("POST", { motivo }))); } catch (err) { errore(err); }
      };
      document.querySelectorAll("[data-versione]").forEach(a => a.onclick = async (e) => {
        e.preventDefault();
        try { disegna(await chiama(`/api/monitoraggi/${m.mese}?versione=${a.dataset.versione}`)); } catch (err) { errore(err); }
      });
    }
    const dettaglio = async () => disegna(await chiama(`/api/monitoraggi/${meseScelto}`));
    (meseScelto ? dettaglio() : elenco()).catch(err => { $("contenuto").innerHTML = `<div class="errore" role="alert">${esc(err.message)}</div>`; });
  </script>
</body>
</html>
