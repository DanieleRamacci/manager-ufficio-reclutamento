<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Utenti monitoraggio</title>
  <link rel="stylesheet" href="/monitoraggio/mensile.css">
  <script src="/monitoraggio/menu.js" defer></script>
</head>
<body>
  <main>
    <h1>Utenti</h1>
    <p class="muted">Gli amministratori avviano raccolte e verifiche, creano i monitoraggi e inviano le email. Chi ha il ruolo di lettura vede tutte le tabelle, compresi i dati dei candidati. Le modifiche hanno effetto subito.</p>
    <section>
      <h2>Aggiungi una persona</h2>
      <form id="aggiungi" class="riga">
        <label>Nome utente di Selezioni Online <input id="nome" placeholder="nome.cognome" required autocomplete="off"></label>
        <label>Ruolo <select id="ruolo"><option value="lettura">Lettura</option><option value="amministratore">Amministratore</option></select></label>
        <button class="primario" type="submit">Aggiungi</button>
      </form>
      <div class="errore" id="errore" role="alert" hidden></div>
    </section>
    <section><h2>Chi può entrare</h2><div class="scroll"><table id="utenti"></table></div></section>
    <section><h2>Ultime modifiche</h2><div class="scroll"><table id="registro"></table></div></section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const esc = (t) => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    const ora = (iso) => iso ? new Date(iso).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" }) : "";
    function errore(testo) { $("errore").hidden = !testo; $("errore").textContent = testo || ""; }
    async function chiama(url, opzioni) {
      const r = await fetch(url, { cache: "no-store", ...opzioni });
      const corpo = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(corpo.error || `Errore ${r.status}`);
      return corpo;
    }
    async function carica() {
      const { utenti, registro } = await chiama("/api/utenti");
      $("utenti").innerHTML = `<thead><tr><th>Nome utente</th><th>Ruolo</th><th>Aggiunto da</th><th></th></tr></thead><tbody>` + utenti.map(u => `
        <tr><td>${esc(u.username)}</td><td>${u.iniziale ? "Amministratore (dalla configurazione)" :
          `<select data-ruolo="${esc(u.username)}"><option value="lettura"${u.ruolo === "lettura" ? " selected" : ""}>Lettura</option><option value="amministratore"${u.ruolo === "amministratore" ? " selected" : ""}>Amministratore</option></select>`}</td>
          <td>${esc(u.aggiunto_da)} ${ora(u.aggiunto_il)}</td>
          <td>${u.iniziale ? "" : `<button type="button" data-togli="${esc(u.username)}">Togli</button>`}</td></tr>`).join("") + "</tbody>";
      $("registro").innerHTML = `<thead><tr><th>Quando</th><th>Chi</th><th>Modifica</th></tr></thead><tbody>` + (registro.map(r =>
        `<tr><td>${ora(r.quando)}</td><td>${esc(r.autore)}</td><td>${r.azione === "togli" ? `Tolto ${esc(r.username)}` : `${esc(r.username)}: ${esc(r.ruolo)}`}</td></tr>`).join("")
        || `<tr><td colspan="3" class="muted">Nessuna modifica</td></tr>`) + "</tbody>";
      document.querySelectorAll("[data-ruolo]").forEach(s => s.onchange = () => imposta(s.dataset.ruolo, s.value));
      document.querySelectorAll("[data-togli]").forEach(b => b.onclick = async () => {
        if (!confirm(`Togliere ${b.dataset.togli}?`)) return;
        try { errore(); await chiama(`/api/utenti/${encodeURIComponent(b.dataset.togli)}`, { method: "DELETE" }); await carica(); } catch (e) { errore(e.message); }
      });
    }
    async function imposta(username, ruolo) {
      try {
        errore();
        await chiama("/api/utenti", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username, ruolo }) });
        await carica();
      } catch (e) { errore(e.message); }
    }
    $("aggiungi").onsubmit = async (e) => { e.preventDefault(); await imposta($("nome").value, $("ruolo").value); $("nome").value = ""; };
    carica().catch(e => errore(e.message));
  </script>
</body>
</html>
