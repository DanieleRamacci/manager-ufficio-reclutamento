<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Profili che coordino</title>
  <link rel="stylesheet" href="/monitoraggio/app.css">
  <script src="/monitoraggio/app.js"></script>
</head>
<body>
<main id="contenuto"><p class="muted">Caricamento…</p></main>
<script>
  const { $, esc, ora, chiama, json, toast, testataArea } = App;
  let dati = null;

  async function azione(url, corpo, messaggio) {
    try { await chiama(url, json("POST", corpo)); toast(messaggio); await carica(); }
    catch (err) { toast(err.message); await carica(); }  // es. il profilo è stato appena scelto da un altro
  }
  const MOBILITA = "Mobilità";
  function riga(p) {
    const preso = p.titolare && !p.mio;
    const stato = p.mio ? "<b>te</b>" : preso ? `scelto da ${esc(p.titolare)}` : `<span class="muted2">libero</span>`;
    const chiedi = !preso ? "" : p.chiesto ? `<span class="pillola p-warn">richiesta inviata</span>`
      : `<button type="button" class="piccolo" data-richiedi="${esc(p.profilo)}" title="La richiesta avvisa te e chi lo ha scelto">Chiedi di prenderlo</button>`;
    return `<tr${p.profilo === MOBILITA ? ' style="border-top:2px solid var(--border)"' : ""}>
      <td><label class="spunta"${preso ? ` title="Lo ha scelto ${esc(p.titolare)}"` : ""}><input type="checkbox" data-profilo="${esc(p.profilo)}"${p.mio ? " checked" : ""}${preso ? " disabled" : ""}> <b>${esc(p.profilo)}</b></label></td>
      <td class="small muted">${esc(p.livelli || "tutti i livelli")}</td><td>${stato}</td><td>${chiedi}</td></tr>`;
  }
  function disegna() {
    const miei = dati.profili.filter(p => p.mio);
    $("contenuto").innerHTML = `<section><h1>Profili che coordino</h1>
        <p class="muted small" style="margin:4px 0 0">Spunta i profili che coordini: vedi i bandi di quei profili, anche quelli non ancora pubblicati. Ogni profilo comprende tutti i suoi livelli.
        «Mobilità» comprende tutti i bandi di mobilità, di ogni profilo.</p>
        <p class="muted small" style="margin:4px 0 0">Ogni profilo ha un solo coordinatore: se lo ha già scelto un'altra persona non puoi spuntarlo, ma puoi chiedere di prenderlo.
        La richiesta avvisa entrambi; chi lo ha può cederlo, altrimenti decide l'Ufficio reclutamento.</p>
        ${miei.length ? `<p style="margin:10px 0 0"><a class="pulsante" href="/referenti/monitoraggi">Vai ai monitoraggi</a> <a href="/referenti/stato" style="margin-left:8px">Stato complessivo</a></p>`
          : `<div class="avviso" style="margin-top:10px">Per vedere i bandi spunta almeno un profilo.</div>`}</section>
      ${dati.richieste_ricevute.length ? `<section><h2>Richieste per i tuoi profili</h2><ul>${dati.richieste_ricevute.map(r => `<li style="margin-bottom:6px">${esc(r.richiedente)} chiede il profilo «${esc(r.profilo)}» (dal ${esc(ora(r.quando))})
        <button type="button" class="piccolo" data-cedi="${r.id}">Cedi il profilo</button></li>`).join("")}</ul></section>` : ""}
      <section><div class="scroll"><table><thead><tr><th>Profilo</th><th>Comprende</th><th>Coordinato da</th><th></th></tr></thead><tbody>
        ${dati.profili.map(riga).join("") || `<tr><td colspan="4" class="muted">Nessun profilo disponibile.</td></tr>`}</tbody></table></div></section>`;
    const attivi = !dati.anteprima;
    document.querySelectorAll("[data-profilo],[data-richiedi],[data-cedi]").forEach(b => {
      if (!attivi) { b.disabled = true; b.title = "Disattivato nell'anteprima"; }
    });
    if (!attivi) return;
    document.querySelectorAll("input[data-profilo]").forEach(b => b.onchange = () => {
      const profilo = b.dataset.profilo;
      if (b.checked) return azione("/api/area-referenti/profili/prendi", { profilo }, "Profilo aggiunto");
      if (!confirm(`Non coordini più «${profilo}»?`)) { b.checked = true; return; }
      azione("/api/area-referenti/profili/lascia", { profilo }, "Profilo lasciato");
    });
    document.querySelectorAll("[data-richiedi]").forEach(b => b.onclick = () => azione("/api/area-referenti/profili/richiedi", { profilo: b.dataset.richiedi }, "Richiesta inviata: avvisati entrambi"));
    document.querySelectorAll("[data-cedi]").forEach(b => b.onclick = () => confirm("Cedere il profilo a chi l'ha chiesto?") && azione(`/api/area-referenti/profili/richieste/${b.dataset.cedi}/cedi`, {}, "Profilo ceduto"));
  }
  async function carica() {
    try {
      dati = await chiama("/api/area-referenti/profili");
      if (!document.querySelector(".testata-area")) testataArea({ email: dati.email, anteprima: dati.anteprima, coordinatore: true }, "profili");
      disegna();
    } catch (err) {
      if (err.status === 401) { location.href = "/referenti"; return; }
      if (err.status === 403) { location.href = "/referenti/stato"; return; }
      $("contenuto").innerHTML = `<div class="errore" role="alert">${esc(err.message)}</div>`;
    }
  }
  carica();
</script>
</body>
</html>
