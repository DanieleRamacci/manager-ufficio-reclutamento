<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File segreteria</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #fff; --text: #1b2230; --muted: #5b6472; --line: #e3e6eb;
    --accent: #1f5fbf; --ok: #1e7b45; --warn: #9a6200; --err: #b42318; --chip: #eef0f3; --evidenza: #fff3c4; --testa: #fafbfc;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { padding: 12px 16px 24px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  .muted { color: var(--muted); }
  .schede { display: flex; gap: 4px; margin: 10px 0 0; flex-wrap: wrap; }
  .schede button { font: inherit; padding: 6px 14px; border: 1px solid var(--line); border-bottom: none; border-radius: 6px 6px 0 0;
                   background: var(--testa); color: var(--text); cursor: pointer; }
  .schede button.attiva { background: var(--card); font-weight: 700; }
  .foglio { background: var(--card); border: 1px solid var(--line); overflow: auto; max-height: calc(100vh - 170px); }
  table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); padding: 3px 8px; white-space: nowrap; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  thead th { position: sticky; top: 0; background: var(--testa); z-index: 1; text-align: left; }
  td.n { color: var(--muted); text-align: right; background: var(--testa); position: sticky; left: 0; }
  tr.evidenza td { background: var(--evidenza); }
  input { font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--card); color: var(--text); }
</style>
<script src="/monitoraggio/menu.js" defer></script>
</head>
<body>
<main>
  <h1>File della segreteria <span class="muted" id="info"></span></h1>
  <div class="muted" id="nota"></div>
  <div style="margin-top:8px"><input type="search" id="cerca" placeholder="Cerca nel foglio (bando, protocollo…)" size="34">
    <a href="/monitoraggio/segreteria" style="margin-left:10px">Caricamento e rapporto del file</a></div>
  <div class="schede" id="schede"></div>
  <div class="foglio" id="foglio"><div class="muted" style="padding:12px">Caricamento…</div></div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NOMI = { bandi: "Bandi", graduatorie: "Graduatorie", scorrimento: "Scorrimento" };
const parametri = new URLSearchParams(location.search);
let dati = null;

async function carica(query) {
  const r = await fetch("/api/segreteria/foglio?" + query, { cache: "no-store" });
  const corpo = await r.json();
  if (!r.ok) { $("foglio").innerHTML = `<div class="muted" style="padding:12px">${esc(corpo.error)}</div>`; return; }
  dati = corpo;
  $("info").textContent = `· ${corpo.nome_file || ""} · caricato ${corpo.caricata_il ? new Date(corpo.caricata_il).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" }) : ""}`;
  $("nota").textContent = corpo.evidenza.length ? `Evidenziate le ${corpo.evidenza.length} righe dell'atto selezionato (righe Excel ${corpo.evidenza.join(", ")}).` : "";
  $("schede").innerHTML = corpo.fogli.map(f => `<button class="${f.foglio === corpo.foglio ? "attiva" : ""}" data-f="${f.foglio}">${NOMI[f.foglio] || f.foglio} <span class="muted">(${f.righe})</span></button>`).join("");
  document.querySelectorAll("#schede button").forEach(b => b.onclick = () => carica(`versione=${corpo.versione}&foglio=${b.dataset.f}`));
  disegna();
  const prima = document.querySelector("tr.evidenza");
  if (prima) prima.scrollIntoView({ block: "center" });
}

function disegna() {
  const q = $("cerca").value.trim().toLowerCase();
  const evid = new Set(dati.evidenza);
  const righe = dati.righe.filter(r => !q || Object.values(r.valori).some(v => String(v).toLowerCase().includes(q)));
  $("foglio").innerHTML = `<table><thead><tr><th>#</th>${dati.colonne.map(c => `<th title="${esc(c)}">${esc(c)}</th>`).join("")}</tr></thead><tbody>` +
    righe.map(r => `<tr class="${evid.has(r.numero_riga) ? "evidenza" : ""}"><td class="n">${r.numero_riga}</td>${dati.colonne.map(c => {
      const v = r.valori[c];
      const testo = typeof v === "string" && /^https?:\/\//.test(v) ? `<a href="${esc(v)}" target="_blank">apri</a>` : esc(v ?? "");
      return `<td title="${esc(v ?? "")}">${testo}</td>`;
    }).join("")}</tr>`).join("") + "</tbody></table>";
}

$("cerca").addEventListener("input", () => dati && disegna());
carica(parametri.get("atto") ? `atto=${encodeURIComponent(parametri.get("atto"))}` : `foglio=${encodeURIComponent(parametri.get("foglio") || "bandi")}`)
  .catch(e => { $("foglio").innerHTML = `<div class="muted" style="padding:12px">Errore: ${esc(e.message)}</div>`; });
</script>
</body>
</html>
